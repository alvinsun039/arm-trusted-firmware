name: bl31-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install the cross compiler
        run: |
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            timeout 300 sudo apt-get -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 update
            timeout 300 sudo apt-get -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 install -y \
              gcc-aarch64-linux-gnu device-tree-compiler
          fi

      - name: Build BL31
        run: ./build.sh

      - name: Check the artifact
        run: |
          image=build/sun60iw2p1/release/bl31.bin
          test -s "$image"
          stat -c '%n: %s bytes' "$image"
          file "$image"
